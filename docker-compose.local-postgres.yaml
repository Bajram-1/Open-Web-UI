services:
  open-webui:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?Set WEBUI_SECRET_KEY in the local env file}
      DATABASE_URL: postgresql://openwebui:${OPENWEBUI_POSTGRES_PASSWORD:?Set OPENWEBUI_POSTGRES_PASSWORD in the local env file}@host.docker.internal:5432/OpenWebUI
      SCARF_NO_ANALYTICS: "true"
      DO_NOT_TRACK: "true"
      ANONYMIZED_TELEMETRY: "false"
    volumes:
      - open-webui-local-data:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  open-webui-local-data:
