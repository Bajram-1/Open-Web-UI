services:
  open-webui:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      # Require external PostgreSQL instead of silently creating local SQLite.
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to a PostgreSQL connection URL in Dokploy}
      SCARF_NO_ANALYTICS: "true"
      DO_NOT_TRACK: "true"
      ANONYMIZED_TELEMETRY: "false"

      # Account policy: administrators create and manage all accounts.
      # The first account remains the primary admin; accounts created by an
      # administrator use the regular "user" role unless explicitly promoted.
      ENABLE_SIGNUP: "false"
      DEFAULT_USER_ROLE: "user"

      # Models that regular users may see and select in chat. Keep this list
      # explicit so internal/provider models remain hidden.
      END_USER_MODEL_IDS: ${END_USER_MODEL_IDS:-ai-digital-assistant-of-albanian-armed-forces,gemma4:e4b}

      # Regular users are chat-only. Administrators bypass these restrictions
      # and retain access to user CRUD, Knowledge and document management.
      USER_PERMISSIONS_WORKSPACE_MODELS_ACCESS: "false"
      USER_PERMISSIONS_WORKSPACE_KNOWLEDGE_ACCESS: "false"
      USER_PERMISSIONS_WORKSPACE_PROMPTS_ACCESS: "false"
      USER_PERMISSIONS_WORKSPACE_TOOLS_ACCESS: "false"
      USER_PERMISSIONS_WORKSPACE_SKILLS_ACCESS: "false"
      USER_PERMISSIONS_CHAT_FILE_UPLOAD: "false"
      USER_PERMISSIONS_CHAT_WEB_UPLOAD: "false"
      USER_PERMISSIONS_FEATURES_WEB_SEARCH: "false"
      USER_PERMISSIONS_FEATURES_IMAGE_GENERATION: "false"
      USER_PERMISSIONS_FEATURES_CODE_INTERPRETER: "false"
      USER_PERMISSIONS_FEATURES_API_KEYS: "false"
    volumes:
      - open-webui-data:/app/backend/data

  # The assistant's documents page under the OpenWebUI address:
  # https://<domain>/dokumentet/admin. In Dokploy -> Domains this service gets
  # the same host with Path /dokumentet and "Strip Path" on. It passes on only
  # the page (/admin) and the document API (/documents) of the assistant,
  # never its chat API. The menu item "Dokumentet" (static/static/loader.js)
  # opens it.
  rag-dokumentet:
    image: nginx:1.27-alpine
    restart: unless-stopped
    expose:
      - "80"
    environment:
      RAG_API_URL: ${RAG_API_URL:-http://192.168.88.196:8000}
    volumes:
      - ./rag-dokumentet.conf.template:/etc/nginx/templates/default.conf.template:ro

volumes:
  open-webui-data:
